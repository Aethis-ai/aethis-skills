name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tool-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skills
        uses: actions/checkout@v4

      - name: Check out MCP source of truth
        uses: actions/checkout@v4
        with:
          repository: Aethis-ai/aethis-mcp
          path: upstream/aethis-mcp

      - name: Verify public skill and MCP tool surfaces agree
        run: |
          npm ci --prefix upstream/aethis-mcp
          npm run build --prefix upstream/aethis-mcp
          node scripts/emit-mcp-tools-list.mjs upstream/aethis-mcp/dist/index.js tools-list.json
          AETHIS_MCP_TOOLS_LIST=tools-list.json npm run check
          AETHIS_MCP_SERVER=upstream/aethis-mcp/dist/index.js npm test
